<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>路径报告工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f2;color:#21372e;font:17px/1.65 system-ui,"Microsoft YaHei",sans-serif}
.top{background:#163f32;color:#fff}.bar,main{width:min(1180px,calc(100% - 48px));margin:auto}.bar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:19px 0}.bar strong{font-size:18px;letter-spacing:.07em}.bar a{color:#fff;border:1px solid #8aa99a;border-radius:7px;padding:6px 14px;text-decoration:none}.bar a:hover{background:#315d4e}
main{padding:36px 0}.intro{margin-bottom:24px}h1,h2,p{margin:0}h1{font-size:clamp(30px,4vw,46px);letter-spacing:.025em;line-height:1.3;font-family:Georgia,"Noto Serif CJK SC",serif}.intro p{margin-top:10px;color:#51695d}
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(285px,1fr);gap:20px}.panel{background:white;border:1px solid #cfdbd2;border-radius:12px;padding:24px;min-width:0}.panel h2{font-size:21px;margin-bottom:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fields label{display:grid;gap:6px;font-weight:600}
input,button{font:inherit}.fields input{width:100%;padding:11px 12px;border:1px solid #a8bcaf;border-radius:7px;background:#fbfcfa;color:#173e30}.fields input:focus{outline:2px solid #689580;outline-offset:2px}input::placeholder{font-weight:400;color:#697c71}.check{display:flex;align-items:center;gap:8px;margin:18px 0}.check input{accent-color:#216143;width:17px;height:17px}
.actions{display:flex;gap:10px;flex-wrap:wrap}button{border-radius:7px;border:1px solid #9eb5a6;background:white;color:#244736;padding:8px 17px;cursor:pointer}button[type=submit]{background:#20563e;color:white;border-color:#20563e}button:hover:enabled{box-shadow:0 2px 7px #163f3226}button:disabled{opacity:.5;cursor:default}
#status{padding-top:14px;margin-top:18px;border-top:1px solid #dae4db;color:#4a6556}.files{background:#f3f7f2;border:1px solid #dce7da;border-radius:7px;padding:16px;color:#476052;overflow-wrap:anywhere}.files p+p{margin-top:8px}.files a{color:#17553c}
.log{margin-top:20px}.log h2{margin-bottom:12px}pre{background:#21382e;color:#e0ece4;padding:14px 17px;border-radius:7px;max-height:320px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.6 ui-monospace,monospace;margin:0}pre:empty:before{content:"等待任务启动";color:#bdd1c4}
@media(max-width:760px){.grid,.fields{grid-template-columns:1fr}.bar,main{width:calc(100% - 28px)}.bar{gap:8px}.bar a{font-size:15px}.panel{padding:18px}main{padding:24px 0}}
.workspace-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.workspace-links a{color:#244f3b;background:#fff;border:1px solid #c1d2c5;border-radius:6px;padding:6px 12px;text-decoration:none;font-size:16px}.workspace-links a:hover{background:#edf5ed}
</style></head><body>
<header class="top"><div class="bar"><strong>输电设计工作台</strong><a href="/workbench/#description">进入报告工作区 ↗</a></div></header>
<main><div class="intro"><h1>路径报告生成</h1><p>输入本地地图坐标，生成路径描述、方案比选和合规分析。</p></div>
<div class="grid"><section class="panel"><h2>规划参数</h2><form id="form">
<div class="fields"><label>起点 X、Y<input id="start" placeholder="留空使用配置起点"></label><label>终点 X、Y<input id="end" placeholder="留空使用配置终点"></label></div>
<label class="check"><input type="checkbox" id="replan">重新规划两条路线</label><div class="actions"><button type="submit">生成报告</button><button type="button" id="cancel" disabled>取消当前任务</button></div></form><p id="status" role="status">尚未提交任务</p></section>
<section class="panel"><h2>成果下载</h2><div id="files" class="files">成果将在生成后列出。</div><nav class="workspace-links" aria-label="浏览报告工作区"><a href="/workbench/#description">路径描述 ↗</a><a href="/workbench/#comparison">方案比选 ↗</a><a href="/workbench/#compliance">合规分析 ↗</a></nav></section></div>
<section class="panel log"><h2>运行日志</h2><pre id="log"></pre></section></main>
<script>let job=null,timer=null;const byId=id=>document.getElementById(id);
async function call(url,options){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
async function poll(){try{const s=await call('/api/reports/'+job);byId('status').textContent=s.status+' · '+(s.progress?.stage||'等待运行');
byId('files').replaceChildren(...s.artifacts.map(a=>{const p=document.createElement('p'),link=document.createElement('a');link.textContent=a.name;link.href='/api/reports/'+job+'/files/'+a.name.split('/').map(encodeURIComponent).join('/');p.append(link);return p}));
if(!s.artifacts.length)byId('files').textContent='成果将在生成后列出。';byId('cancel').disabled=!['queued','running'].includes(s.status);
byId('log').textContent=await(await fetch('/api/reports/'+job+'/log')).text();if(['completed','failed','cancelled','review_required','interrupted'].includes(s.status))clearInterval(timer)}catch(e){byId('status').textContent=e.message}}
byId('form').onsubmit=async e=>{e.preventDefault();try{const data={replan:byId('replan').checked};for(const k of ['start','end']){if(byId(k).value.trim()){const p=byId(k).value.split(/[,，\s]+/).map(Number);if(p.length!==2||p.some(x=>!Number.isFinite(x)))throw Error('坐标须为两个数字');data[k]=p}}const s=await call('/api/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});job=s.id;clearInterval(timer);timer=setInterval(poll,2000);await poll()}catch(e){byId('status').textContent=e.message}};
byId('cancel').onclick=async()=>{if(job){await call('/api/reports/'+job+'/cancel',{method:'POST'});await poll()}};</script></body></html>
